name: Build and sign Windows release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (MAJOR.MINOR.PATCH)
        required: true
        default: 1.2.1
      submit_for_signing:
        description: Submit this manual build to SignPath
        required: true
        type: boolean
        default: false
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  actions: read
  contents: read

jobs:
  build-and-sign:
    runs-on: windows-2022

    steps:
      - name: Check out exact source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.9"

      - name: Determine release version
        shell: pwsh
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            $version = $env:DISPATCH_VERSION
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid release version: $version"
          }
          "PEARIPHERALS_VERSION=$version" >> $env:GITHUB_ENV

      - name: Install hash-locked build dependencies without cache
        run: python -m pip install --disable-pip-version-check --no-cache-dir --require-hashes -r requirements-build.txt

      - name: Run complete unit test gate
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run byte-compilation gate
        run: python -m py_compile pearipherals.py pearipherals_core.py pearipherals_snipping.py pearipherals_support.py pearipherals_version.py scripts/write_build_manifest.py scripts/write_version_info.py tests/test_core.py tests/test_release.py tests/test_snipping.py tests/test_support.py

      - name: Generate version resource
        run: python scripts/write_version_info.py $env:PEARIPHERALS_VERSION build/pearipherals-version-info.txt

      # Generated from the SAME validated version input as the PE resource
      # above, plus the exact checked-out revision, so a frozen build can name
      # its source revision independently of Authenticode. Written before
      # PyInstaller analysis so it can be bundled as one-file data.
      - name: Generate deterministic build manifest
        run: python scripts/write_build_manifest.py $env:PEARIPHERALS_VERSION $env:GITHUB_SHA build/pearipherals-build.json

      - name: Build unsigned Windows executable
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --name Pearipherals
          --icon pearipherals.ico
          --version-file build/pearipherals-version-info.txt
          --add-data "build/pearipherals-build.json;."
          --hidden-import pystray._win32
          pearipherals.py

      - name: Record unsigned checksum
        shell: pwsh
        run: Get-FileHash dist/Pearipherals.exe -Algorithm SHA256

      - name: Upload clearly labeled unsigned artifact for origin verification
        id: upload-unsigned
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Pearipherals-${{ env.PEARIPHERALS_VERSION }}-unsigned-do-not-release
          path: dist/Pearipherals.exe
          if-no-files-found: error
          retention-days: 14

      - name: Require complete signing configuration
        if: github.ref_type == 'tag' || inputs.submit_for_signing
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_POLICY_SLUG: ${{ vars.SIGNPATH_POLICY_SLUG }}
          SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          SIGNPATH_EXPECTED_SIGNER: ${{ vars.SIGNPATH_EXPECTED_SIGNER }}
        run: |
          $required = @(
            'SIGNPATH_API_TOKEN',
            'SIGNPATH_ORGANIZATION_ID',
            'SIGNPATH_PROJECT_SLUG',
            'SIGNPATH_POLICY_SLUG',
            'SIGNPATH_ARTIFACT_CONFIGURATION_SLUG',
            'SIGNPATH_EXPECTED_SIGNER'
          )
          $missing = @($required | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) })
          if ($missing.Count -ne 0) {
            throw "Official signing is not configured; missing: $($missing -join ', ')"
          }

      - name: Submit to SignPath
        id: sign
        if: github.ref_type == 'tag' || inputs.submit_for_signing
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2.3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
          parameters: |
            version: "${{ env.PEARIPHERALS_VERSION }}"

      - name: Verify exactly one signed executable
        if: steps.sign.outcome == 'success'
        shell: pwsh
        env:
          EXPECTED_SIGNER: ${{ vars.SIGNPATH_EXPECTED_SIGNER }}
        run: |
          $matches = @(Get-ChildItem signed -Filter Pearipherals.exe -Recurse)
          if ($matches.Count -ne 1) {
            throw "Expected exactly one signed Pearipherals.exe, found $($matches.Count)"
          }
          $exe = $matches[0]
          $signature = Get-AuthenticodeSignature $exe.FullName
          if ($signature.Status -ne 'Valid') {
            throw "Signature validation failed: $($signature.Status)"
          }
          if ($signature.SignerCertificate.Subject -notlike "*$env:EXPECTED_SIGNER*") {
            throw "Unexpected signer: $($signature.SignerCertificate.Subject)"
          }
          if (-not $signature.TimeStamperCertificate) {
            throw 'The signed executable has no trusted timestamp'
          }
          $info = $exe.VersionInfo
          if ($info.ProductName -ne 'Pearipherals' -or
              $info.ProductVersion -ne $env:PEARIPHERALS_VERSION -or
              $info.FileVersion -ne $env:PEARIPHERALS_VERSION -or
              $info.OriginalFilename -ne 'Pearipherals.exe') {
            throw "Unexpected executable metadata: $($info.ProductName) $($info.ProductVersion) $($info.FileVersion) $($info.OriginalFilename)"
          }
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item $exe.FullName release/Pearipherals.exe
          $signature | Format-List Status,StatusMessage,SignerCertificate,TimeStamperCertificate
          Get-FileHash release/Pearipherals.exe -Algorithm SHA256

      - name: Upload exact verified signed release candidate
        if: steps.sign.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Pearipherals-${{ env.PEARIPHERALS_VERSION }}-signed
          path: release/Pearipherals.exe
          if-no-files-found: error
          retention-days: 30
